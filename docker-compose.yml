version: "3.9"

services:

  backend:
    build: ./1.backend

    ports:
      - "8010:8000"

    depends_on:
      - db

    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/finance

  db:
    image: postgres:15

    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: finance

    ports:
      - "5433:5432"
